project:
  type: website
  output-dir: _site
  preview:
    port: 5679
    browser: true
  render:
    - "!chunks/"
    - "**/*.qmd"
  resources:
    - images/

website:
  title: climateindicators.us
  llms-txt: true
  site-url: https://climateindicators.us
  repo-url: https://github.com/climateindicators/climateindicators.us
  back-to-top-navigation: true
  open-graph:
    site-name: https://climateindicators.us
  page-footer:
    background: dark
    center:
      - text: "Site made with <i class='bi bi-heart-fill'></i>, <i class='bi bi-git'></i></a>, and <img src='/images/icon-quarto.svg' width=13 style='vertical-align:-1px;margin-right:0.25em'><a href='https://quarto.org/' target='_blank'>Quarto</a>"

  navbar:
    background: dark
    search: true
    left:
      - icon: house-door
        text: "Home"
        href: index.qmd
      
    right:
      - icon: info-circle
        text: "About"
        href: about.qmd
      - icon: graph-up
        text: "Indicators"
        href: indicators.qmd
      - icon: book
        text: "The Whole Story"
        href: tracking-the-whole-climate-change-story.qmd
      - icon: folder2-open
        text: "Methodology"
        href: methodology.qmd
      - icon: leaf
        text: "Applying and Advancing Climate Indicators"
        href: applying-and-advancing-climate-indicators.qmd



  sidebar:
    - title: "Indicators"
      style: "docked"
      background: light
      contents:
        - text: "All Indicators"
          href: indicators.qmd

        - section: "Health and Society"
          contents:
            - text: "Heat-Related Deaths"
              href: indicators/heat-related-deaths.qmd
            - text: "Cold-Related Deaths"
              href: indicators/cold-related-deaths.qmd
            - text: "Heat-Related Workplace Deaths"
              href: indicators/heat-related-workplace-deaths.qmd
            - text: "Lyme Disease"
              href: indicators/lyme-disease.qmd
            - text: "Heat-Related Illnesses"
              href: indicators/heat-related-illnesses.qmd
            - text: "Heating and Cooling Degree Days"
              href: indicators/heating-and-cooling-degree-days.qmd
            - text: "Residential Energy Use"
              href: indicators/residential-energy-use.qmd
            - text: "West Nile Virus"
              href: indicators/west-nile-virus.qmd
            - text: "Length of Growing Season"
              href: indicators/length-of-growing-season.qmd
            - text: "Growing Degree Days"
              href: indicators/growing-degree-days.qmd
            - text: "Ragweed Pollen Season"
              href: indicators/ragweed-pollen-season.qmd
        - section: "Greenhouse Gasses"
          contents:
            - text: "Global Greenhouse Gas Emissions"
              href: indicators/global-greenhouse-gas-emissions.qmd
        - section: "Environment"
          contents:
            - text: "Leaf and Bloom Dates"
              href: indicators/leaf-and-bloom-dates.qmd
            - text: "Community Connection: Cherry Blossom Bloom Dates in Washington, D.C."
              href: indicators/cherry-blossom-bloom.qmd
            - text: "Wildfires"
              href: indicators/wildfires.qmd
            - text: "Bird Wintering Ranges"
              href: indicators/bird-wintering-ranges.qmd
            - text: "Marine Species Distribution"
              href: indicators/marine-species-distribution.qmd
        - section: "Weather and Climate"
          contents:
            - text: "U.S. and Global Temperature"
              href: indicators/us-and-global-temperature.qmd
            - text: "Seasonal Temperature"
              href: indicators/seasonal-temperature.qmd
            - text: "High and Low Temperatures"
              href: indicators/high-and-low-temperatures.qmd
            - text: "Heat Waves"
              href: indicators/heat-waves.qmd
            - text: "Heavy Precipitation"
              href: indicators/heavy-precipitation.qmd
            - text: "Drought"
              href: indicators/drought.qmd
            - text: "A Closer Look: Temperature and Drought in the Southwest"
              href: indicators/temperature-and-drought-in-the-southwest.qmd
            - text: "River Flooding"
